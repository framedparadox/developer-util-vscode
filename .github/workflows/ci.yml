name: CI

on:
  push:
    branches: [main, release/**]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Compile tests
        run: npm run compile-tests

      - name: Run tests (headless)
        uses: coactions/setup-xvfb@v1
        with:
          run: npm test

      - name: Package (dry-run)
        run: npx vsce package --no-dependencies --out certificate-util.vsix

      - name: Upload VSIX artefact
        uses: actions/upload-artifact@v4
        with:
          name: certificate-util-${{ matrix.node-version }}.vsix
          path: certificate-util.vsix
          retention-days: 7
