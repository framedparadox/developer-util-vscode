name: Publish to VS Code Marketplace

# Triggers:
#   • Push a version tag  (e.g. git tag v1.2.3 && git push origin v1.2.3)
#   • Manual run via GitHub UI (Actions → Publish → Run workflow)
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (package only, do not publish)'
        required: false
        default: 'true'
        type: choice
        options: ['true', 'false']

jobs:
  # ── 1. Validate ────────────────────────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Check formatting
        run: npm run format:check

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Compile
        run: npm run compile

      - name: Compile tests
        run: npm run compile-tests

      - name: Run tests (headless)
        uses: coactions/setup-xvfb@v1
        with:
          run: npm test

  # ── 2. Publish ────────────────────────────────────────────────────────────
  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: validate
    environment: marketplace
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Bump package.json version to match the tag (e.g. v1.2.3 → 1.2.3).
      # Skipped on manual dry-run because there is no tag to parse.
      - name: Sync version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          echo "Tagging version: $TAG (current package.json: $CURRENT_VERSION)"

          if [ "$CURRENT_VERSION" = "$TAG" ]; then
            echo "package.json is already at version $TAG; skipping npm version."
          else
            npm version "$TAG" --no-git-tag-version
          fi

      - name: Package VSIX
        run: npm run package:vsix -- --out devx.vsix

      - name: Upload VSIX artefact
        uses: actions/upload-artifact@v4
        with:
          name: devx.vsix
          path: devx.vsix
          retention-days: 30

      # Publish to VS Code Marketplace.
      # Requires VSCE_PAT secret in GitHub repository / environment settings.
      # Set it at: Settings → Secrets and variables → Actions → New repository secret
      - name: Publish to VS Code Marketplace
        if: ${{ inputs.dry_run != 'true' }}
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --no-install vsce publish --no-dependencies --packagePath devx.vsix

      # Publish to Open VSX Registry (optional mirror – remove block if not needed).
      # Requires OVSX_PAT secret in GitHub repository settings.
      - name: Publish to Open VSX
        if: ${{ inputs.dry_run != 'true' }}
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --no-install ovsx publish devx.vsix --pat "$OVSX_PAT"

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') && inputs.dry_run != 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: devx.vsix
          generate_release_notes: true
