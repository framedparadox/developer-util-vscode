name: Publish to VS Code Marketplace

on:
  push:
    tags:
      - "v*.*.*" # GitHub uses glob, not regex
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (package only, do not publish)"
        required: false
        default: "false"
        type: choice
        options: ["true", "false"]

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Compile
        run: npm run compile

      - name: Compile tests
        run: npm run compile-tests

      - name: Run tests (headless)
        uses: coactions/setup-xvfb@v1
        with:
          run: npm test

  publish:
    name: Publish
    runs-on: ubuntu-latest
    needs: validate
    environment: marketplace

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Sync version from tag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/v}"
          CURRENT_VERSION="$(node -p "require('./package.json').version")"
          echo "Tagging version: $TAG (current package.json: $CURRENT_VERSION)"

          if [ "$CURRENT_VERSION" = "$TAG" ]; then
            echo "package.json is already at version $TAG; skipping npm version."
          else
            npm version "$TAG" --no-git-tag-version
          fi

      - name: Package VSIX
        run: npx vsce package --no-dependencies --out devx.vsix

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: devx.vsix
          path: devx.vsix
          retention-days: 30

      - name: Validate VSCE_PAT exists
        if: github.event_name == 'push' || inputs.dry_run != 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: |
          if [ -z "$VSCE_PAT" ]; then
            echo "ERROR: VSCE_PAT is not set for this workflow/environment."
            echo "Set it in: Settings → Environments → marketplace → Secrets"
            exit 1
          fi

      - name: Verify VSCE_PAT permissions
        if: github.event_name == 'push' || inputs.dry_run != 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce verify-pat -p "$VSCE_PAT"

      - name: Publish to VS Code Marketplace
        if: github.event_name == 'push' || inputs.dry_run != 'true'
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --no-dependencies --packagePath devx.vsix

      - name: Publish to Open VSX
        if: github.event_name == 'push' || inputs.dry_run != 'true'
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish devx.vsix --pat "$OVSX_PAT"
        continue-on-error: true

      - name: Create GitHub Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: devx.vsix
          generate_release_notes: true